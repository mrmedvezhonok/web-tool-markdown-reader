<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown Reader</title>
  <link rel="stylesheet" href="style.css">
  <link id="hljs-light" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <link id="hljs-dark" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" disabled>
</head>
<body>
  <!-- Icon sprite: referenced below via <use href="#i-…">. Strokes follow the button text colour. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 15V9l3 3 3-3v6"/><path d="M17 9v6m-2.5-2.5L17 15l2.5-2.5"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v5h8V3"/><path d="M7 21v-7h10v7"/></symbol>
    <symbol id="i-html" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></symbol>
    <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
    <symbol id="i-split" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></symbol>
    <symbol id="i-read" viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></symbol>
    <symbol id="i-toc" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
  </svg>

  <header class="toolbar">
    <div class="brand">
      <svg class="icon logo"><use href="#i-logo"/></svg>
      <span class="title" id="docTitle">Untitled.md</span>
    </div>
    <div class="actions">
      <div class="group" role="group" aria-label="File">
        <button class="btn" id="openBtn" title="Open a .md file (Ctrl+O)">
          <svg class="icon"><use href="#i-open"/></svg><span class="label">Open</span>
        </button>
        <button class="btn" id="saveBtn" title="Download as .md (Ctrl+S)">
          <svg class="icon"><use href="#i-save"/></svg><span class="label">Save</span>
        </button>
        <input type="file" id="fileInput" accept=".md,.markdown,.mdown,.txt,text/markdown,text/plain" hidden>
      </div>
      <span class="sep" aria-hidden="true"></span>
      <div class="group" role="group" aria-label="Export">
        <button class="btn" id="exportBtn" title="Download as standalone HTML">
          <svg class="icon"><use href="#i-html"/></svg><span class="label">HTML</span>
        </button>
        <button class="btn" id="pdfBtn" title="Export to PDF via the print dialog (Ctrl+P)">
          <svg class="icon"><use href="#i-pdf"/></svg><span class="label">PDF</span>
        </button>
      </div>
      <span class="sep" aria-hidden="true"></span>
      <div class="segmented" role="group" aria-label="View mode">
        <button data-mode="edit" title="Editor only (Ctrl+E cycles views)">
          <svg class="icon"><use href="#i-edit"/></svg><span class="label">Edit</span>
        </button>
        <button data-mode="split" title="Editor and preview side by side">
          <svg class="icon"><use href="#i-split"/></svg><span class="label">Split</span>
        </button>
        <button data-mode="read" title="Preview only">
          <svg class="icon"><use href="#i-read"/></svg><span class="label">Read</span>
        </button>
      </div>
      <span class="sep" aria-hidden="true"></span>
      <div class="group" role="group" aria-label="Display">
        <button class="btn" id="tocBtn" title="Table of contents" aria-pressed="false">
          <svg class="icon"><use href="#i-toc"/></svg><span class="label">Contents</span>
        </button>
        <button class="btn icon-only" id="themeBtn" title="Toggle light/dark theme" aria-label="Toggle light/dark theme">
          <svg class="icon icon-moon"><use href="#i-moon"/></svg>
          <svg class="icon icon-sun"><use href="#i-sun"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="mode-split">
    <aside id="toc" class="toc" hidden></aside>
    <section class="pane editor-pane">
      <textarea id="editor" spellcheck="false" placeholder="Type or paste Markdown here, or drop a .md file…"></textarea>
    </section>
    <section class="pane preview-pane" id="previewPane">
      <article id="preview" class="markdown-body"></article>
    </section>
  </main>

  <footer class="status" id="status"></footer>

  <div id="dropOverlay" class="drop-overlay" hidden>Drop Markdown file to open</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
